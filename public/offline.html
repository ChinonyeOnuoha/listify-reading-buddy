<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FEEAEE" />
    <title>Reading Buddy — offline</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #feeaee; color: #653b54; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; margin: 1.5rem; padding: 2rem; background: #feece4; border: 1px solid #e7dad5; border-radius: 26px; }
      .mark { font-family: Georgia, serif; font-size: 1.75rem; color: #65083e; letter-spacing: -0.06em; }
      h1 { color: #491332; font-size: 1.375rem; font-weight: 600; margin: 1rem 0 0.5rem; }
      p { line-height: 1.6; margin: 0.5rem 0; }
      .muted { color: #735668; font-size: 0.9375rem; }
      button { margin-top: 1rem; min-height: 44px; padding: 0.6rem 1.25rem; border: 0; border-radius: 14px; background: #65083e; color: #feece4; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #65083e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">RB</div>
      <h1>You're offline</h1>
      <p>Reading Buddy couldn't load because there's no connection and this page hasn't been saved on this device yet.</p>
      <p class="muted">Once you've opened Reading Buddy online, it can open without a connection next time.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
